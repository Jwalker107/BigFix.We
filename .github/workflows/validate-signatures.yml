name: Validate BigFix Inventory Signatures against signature.xsd

# Every file added or modified under content/Signature must be a *.xml file
# that's a well-formed XML document validating against scripts/signature.xsd
# (the root element is always <SoftwareIdentityCatalog> - see that file and
# dev/scripts/signature-schema.md). This is the Signature-directory
# counterpart to validate-content.yml, which covers content/Analysis,
# content/Fixlet, and content/Task against BES.xsd the same way.
#
# Security posture - PR content (including from forks) is untrusted input:
#   - Trigger is `pull_request`, never `pull_request_target`: it runs against the
#     PR's own head with the default token's normal *read-only* permissions and
#     no repository secrets, so a malicious .xml file can at worst make this job
#     fail/time out - it can't gain write access or exfiltrate anything.
#   - `permissions` is pinned down to exactly what's read here.
#   - The schema is read from the PR's *base* commit, not the PR's own tree, so a
#     PR can't rewrite scripts/signature.xsd to make its own malicious content
#     "valid".
#   - xmllint runs with --nonet (never fetch a DTD/entity over the network) and
#     without --noent (entities are left unexpanded rather than substituted, so a
#     billion-laughs-style entity bomb doesn't get expanded in memory), plus a
#     size cap and a timeout per file as a backstop against a pathologically
#     expensive document.
#   - File paths from the PR are read NUL-delimited throughout so no filename
#     (spaces, quotes, unicode, a leading "-", ...) can be misread as extra shell
#     tokens or tool options.
on:
  pull_request:
    branches: [main]
    paths:
      - "content/Signature/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-signatures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          # Deliberately NOT persist-credentials: false - the "fetch
          # scripts/signature.xsd as of the PR base" step below reuses this
          # same injected, read-only credential for its own `git fetch`.
          # Nothing here ever runs PR-provided code, so there's no untrusted
          # step that could read it out of .git/config.

      - name: Install xmllint
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Fetch scripts/signature.xsd as of the PR base (not the PR's own copy)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:scripts/signature.xsd" > "$RUNNER_TEMP/signature.xsd"

      - name: List changed files under content/Signature
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Renamed/added/modified files only - a removed file has nothing to validate.
          gh api \
            --paginate \
            "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            > "$RUNNER_TEMP/changed-files.txt"

          # NUL-separated from here on - see the security note at the top of this file.
          grep -E '^content/Signature/' "$RUNNER_TEMP/changed-files.txt" \
            | tr '\n' '\0' > "$RUNNER_TEMP/changed-files.nul" || true

      - name: Validate each changed file against signature.xsd
        env:
          MAX_BYTES: "10485760" # 10 MiB - generous for a Signature export, small enough to bound parse cost
        run: |
          set -euo pipefail
          schema="$RUNNER_TEMP/signature.xsd"
          fail=0
          checked=0

          while IFS= read -r -d '' file; do
            checked=$((checked + 1))

            # Every remaining path is guaranteed (by the grep above) to start with
            # "content/", so none of these checks can ever be tricked by a filename
            # that looks like a flag.

            if [ -L "$file" ]; then
              printf 'FAIL  %s :: is a symlink, not a regular file\n' "$file"
              fail=1
              continue
            fi
            if [ ! -f "$file" ]; then
              printf 'FAIL  %s :: not found in checkout\n' "$file"
              fail=1
              continue
            fi

            case "$file" in
              *.xml) ;;
              *)
                printf 'FAIL  %s :: filename must end with .xml\n' "$file"
                fail=1
                continue
                ;;
            esac

            size=$(stat -c%s -- "$file")
            if [ "$size" -gt "$MAX_BYTES" ]; then
              printf 'FAIL  %s :: %s bytes exceeds the %s byte validation limit\n' "$file" "$size" "$MAX_BYTES"
              fail=1
              continue
            fi

            if ! output=$(timeout 30s xmllint --nonet --noout --schema "$schema" "$file" 2>&1); then
              printf 'FAIL  %s :: does not validate against scripts/signature.xsd\n' "$file"
              # Cap xmllint's own error text so a file crafted to produce a huge
              # error stream can't flood the job log.
              printf '%s\n' "$output" | head -c 4000
              echo
              fail=1
              continue
            fi

            printf 'PASS  %s\n' "$file"
          done < "$RUNNER_TEMP/changed-files.nul"

          echo
          echo "Checked $checked file(s) under content/Signature."
          exit "$fail"

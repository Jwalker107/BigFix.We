name: Flag changes outside validated content directories

# Every pull request to main is scanned for any created, modified, deleted, or
# renamed file OUTSIDE content/Analysis, content/Fixlet, content/Task, and
# content/Signature - the four directories the other validate-*.yml workflows
# already check automatically. Anything else (workflow files, docs/ and its
# viewer, scripts/, or any new top-level area) gets no automated content
# validation here, so it always needs a human's judgment call before merging.
#
# When such a change is found, this workflow (as github-actions[bot]):
#   1. Submits a REQUEST_CHANGES review, body "Modifications that require
#      further human review".
#   2. Applies the `needs-manual-review` label (creating it first if the repo
#      doesn't have it yet).
#   3. Emits a `::warning file=...,line=1,col=1::...` annotation per
#      out-of-scope file, so it shows up directly on the PR's Files/Checks UI.
#      There's no meaningful line/column for "this whole file is out of
#      scope", so both are always 1.
#
# This workflow is a GATE, not a check: it always exits 0 (see the final
# "Summary" step). Its effect is entirely the review + label it leaves behind
# - a human must explicitly dismiss the review (and remove the label) after
# looking at the flagged changes; this workflow never does either
# automatically, even on a later push that removes the out-of-scope change.
#
# Why `pull_request_target` (unlike validate-content.yml / validate-signatures.yml
# / validate-content-conventions.yml, which all deliberately use plain
# `pull_request`): submitting a review and applying a label both need a WRITE
# token, and the default GITHUB_TOKEN for a fork PR under plain `pull_request`
# is forced read-only regardless of the `permissions:` block below - there is
# no way to do this job under that trigger. `pull_request_target` runs with
# the base repo's write token even for fork PRs, which is exactly why it's
# usually dangerous: the workflow FILE always comes from the base branch
# (safe - a PR can't rewrite this file to change what it does), but a
# workflow can still shoot itself in the foot by checking out and then
# running the PR's own code with that write token. This workflow never does
# that: there is no actions/checkout step at all, and nothing here reads or
# executes any file CONTENT - only the PR's file-list METADATA (path,
# previous path, status) from the GitHub API, which is exactly what it needs
# and no more.
#
# Every value taken from that metadata (a filename, a previous filename) is
# attacker-controlled and is escaped per GitHub's own documented
# `::workflow-command::` escaping rules before being echoed, so a filename
# containing a literal newline, `%`, `:`, or `,` cannot inject a second,
# spoofed annotation or otherwise be misread as workflow-command syntax (see
# escape_property/escape_data below).
#
# Limitation: the GitHub API's PR-files endpoint stops returning entries past
# a few thousand changed files; a PR that large could hide an out-of-scope
# file past that cutoff. Not worth checking out the full diff to work around,
# given how this repo's content PRs actually look in practice.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: flag-out-of-scope-changes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flag-out-of-scope-changes:
    runs-on: ubuntu-latest
    steps:
      - name: List every changed file's path, previous path, and status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api \
            --paginate \
            "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | {filename, previous_filename, status}' \
            > "$RUNNER_TEMP/changed-files.jsonl"

      - name: Find changes outside the validated content directories
        id: scan
        run: |
          set -euo pipefail

          # Per GitHub's documented `::workflow-command::` escaping rules
          # (actions/toolkit's core/src/command.ts: escapeProperty/escapeData):
          # order matters - '%' must be escaped first, or the '%' introduced
          # by the other substitutions would itself get re-escaped.
          escape_property() {
            local s=$1
            s=${s//%/%25}; s=${s//$'\r'/%0D}; s=${s//$'\n'/%0A}
            s=${s//:/%3A}; s=${s//,/%2C}
            printf '%s' "$s"
          }
          escape_data() {
            local s=$1
            s=${s//%/%25}; s=${s//$'\r'/%0D}; s=${s//$'\n'/%0A}
            printf '%s' "$s"
          }

          in_scope() {
            case "$1" in
              content/Analysis/*|content/Fixlet/*|content/Task/*|content/Signature/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          flagged=0
          while IFS= read -r record; do
            filename=$(jq -r '.filename' <<<"$record")
            previous=$(jq -r '.previous_filename // empty' <<<"$record")
            status=$(jq -r '.status' <<<"$record")

            out_of_scope=0
            in_scope "$filename" || out_of_scope=1
            if [ -n "$previous" ]; then
              in_scope "$previous" || out_of_scope=1
            fi
            [ "$out_of_scope" -eq 1 ] || continue

            flagged=$((flagged + 1))
            if [ -n "$previous" ]; then
              message="This ${status} file (renamed from \"${previous}\") is outside content/Analysis, content/Fixlet, content/Task, and content/Signature, so it was not automatically validated and needs manual review."
            else
              message="This ${status} file is outside content/Analysis, content/Fixlet, content/Task, and content/Signature, so it was not automatically validated and needs manual review."
            fi
            echo "::warning file=$(escape_property "$filename"),line=1,col=1::$(escape_data "$message")"
          done < "$RUNNER_TEMP/changed-files.jsonl"

          echo "flagged=$flagged" >> "$GITHUB_OUTPUT"
          echo "$flagged out-of-scope file(s) found."

      - name: Ensure the needs-manual-review label exists
        if: steps.scan.outputs.flagged != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${REPO}/labels/needs-manual-review" >/dev/null 2>&1; then
            gh api --method POST "repos/${REPO}/labels" \
              -f name="needs-manual-review" \
              -f color="B60205" \
              -f description="Touches files outside the automatically-validated content directories; needs a human reviewer's judgment." \
              >/dev/null
          fi

      - name: Apply the needs-manual-review label
        if: steps.scan.outputs.flagged != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=needs-manual-review" >/dev/null

      - name: Request changes on the pull request
        if: steps.scan.outputs.flagged != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            -f event="REQUEST_CHANGES" \
            -f body="Modifications that require further human review" \
            >/dev/null

      - name: Summary
        run: |
          if [ "${{ steps.scan.outputs.flagged }}" != "0" ]; then
            echo "${{ steps.scan.outputs.flagged }} file(s) outside the validated content directories - requested changes and labeled needs-manual-review. A human must dismiss the review (and remove the label) after reviewing."
          else
            echo "No changes outside content/Analysis, content/Fixlet, content/Task, or content/Signature."
          fi
          # Always succeed: this workflow's effect is the review/label above,
          # never its own pass/fail state.
          exit 0
